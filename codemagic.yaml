workflows:
  android-apk:
    name: Strata Conferência - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: stable

    scripts:
      - name: Verificar estrutura Flutter
        script: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/screens/conferencias_list_screen.dart
          test -f lib/screens/conferencia_screen.dart
          test -f lib/screens/conferencia_detail_screen.dart
          test -f lib/models/conferencia_model.dart
          test -f lib/models/foto_model.dart
          test -f lib/models/medicao_model.dart
          test -f lib/database/database_helper.dart
          test -f 20261027_EIXO_GO236_R.xml
          test -f Alinhamento_Horizontal_GO110_Est1500_a_2249.xml
          echo "Estrutura principal conferida."

      - name: Preparar projeto Android
        script: |
          set -e
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name strata_conferencia .
          fi

      - name: Configurar permissões de localização
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace("<application", permission + "\\n    <application", 1)
          manifest.write_text(text)
          PY

      - name: Limpar e instalar dependências
        script: |
          set -e
          flutter clean
          flutter pub get

      - name: Analisar código
        script: |
          set -e
          flutter analyze

      - name: Executar testes
        script: |
          set -e
          flutter test

      - name: Gerar APKs otimizados por arquitetura
        script: |
          set -e
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          ls -lh build/app/outputs/flutter-apk/

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/symbols/**
