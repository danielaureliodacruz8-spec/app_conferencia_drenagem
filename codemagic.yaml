
workflows:
  android-apk:
    name: Strata Conferência Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Conferir arquivos do projeto
        script: |
          echo "===== PASTA ATUAL ====="
          pwd
          echo "===== ARQUIVOS NA RAIZ ====="
          ls -la
          echo "===== PROCURANDO MAIN.DART ====="
          find . -name main.dart -not -path "*/.dart_tool/*" -not -path "*/build/*"

      - name: Criar estrutura Android
        script: |
          if [ ! -f pubspec.yaml ]; then
            echo "ERRO: pubspec.yaml não encontrado na raiz."
            exit 1
          fi

          flutter create --platforms=android --project-name strata_conferencia .

      - name: Conferir código principal
        script: |
          echo "===== MAIN.DART ====="
          if [ ! -f lib/main.dart ]; then
            echo "ERRO: lib/main.dart não encontrado."
            exit 1
          fi

          sed -n '1,140p' lib/main.dart

          if grep -n "material_ui/material_ui.dart" lib/main.dart; then
            echo "ERRO: importação incorreta encontrada."
            exit 1
          fi

      - name: Configurar permissões GPS
        script: |
          python3 - <<'PY'
          from pathlib import Path

          arquivo = Path("android/app/src/main/AndroidManifest.xml")
          texto = arquivo.read_text()

          permissoes = [
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
          ]

          for permissao in permissoes:
              if permissao not in texto:
                  texto = texto.replace(
                      '<application',
                      permissao + '\n    <application',
                      1
                  )

          arquivo.write_text(texto)
          PY

      - name: Instalar dependências
        script: |
          flutter pub get

      - name: Analisar projeto
        script: |
          flutter analyze

      - name: Gerar APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk



